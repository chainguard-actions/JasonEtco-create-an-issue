name: Test issue creation with assignees
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create issue template
        run: |
          mkdir -p .github
          cat > .github/ISSUE_TEMPLATE.md << 'EOF'
          ---
          title: Test Issue with Assignees
          labels: bug
          ---
          This is a test issue created with assignees input.
          EOF

      - id: action
        uses: .
        with:
          assignees: octocat
        continue-on-error: true

      - name: Assert action ran with assignees input or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          NUMBER: ${{ steps.action.outputs.number }}
          URL: ${{ steps.action.outputs.url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "number: $NUMBER"
          echo "url: $URL"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$NUMBER" ]; then
              echo "FAIL: action succeeded but 'number' output is empty"
              exit 1
            fi
            if [ -z "$URL" ]; then
              echo "FAIL: action succeeded but 'url' output is empty"
              exit 1
            fi
            echo "PASS: issue created with assignees, number=$NUMBER url=$URL"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
