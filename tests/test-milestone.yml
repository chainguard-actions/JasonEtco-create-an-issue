name: Test milestone input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Copy fixture template to workspace
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.github"
          cp "$GITHUB_WORKSPACE/actions/hardened/JasonEtco--create-an-issue/v2.9.2/tests/fixtures/MILESTONE_TEMPLATE.md" \
             "$GITHUB_WORKSPACE/.github/ISSUE_TEMPLATE.md"
      - id: action
        uses: .
        continue-on-error: true
        with:
          filename: .github/ISSUE_TEMPLATE.md
          milestone: "1"
        env:
          GITHUB_TOKEN: fake-token-for-testing
      - name: Assert action was invoked with milestone input
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action will fail with a fake token (API call fails), but it should
          # have been invoked correctly. We verify it ran (not skipped).
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action was invoked with milestone input"
