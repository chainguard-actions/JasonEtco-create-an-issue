name: Test with milestone input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create issue template
        run: |
          mkdir -p .github
          cat > .github/ISSUE_TEMPLATE.md << 'EOF'
          ---
          title: Milestone Test Issue
          labels: test
          ---
          This is a test issue created to verify the milestone input is accepted.
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          filename: .github/ISSUE_TEMPLATE.md
          milestone: 1

      - name: Assert action ran (milestone input accepted, or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          NUMBER: ${{ steps.action.outputs.number }}
          URL: ${{ steps.action.outputs.url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "number: $NUMBER"
          echo "url: $URL"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$NUMBER" ]; then
              echo "FAIL: action succeeded but issue number output is empty"
              exit 1
            fi
            echo "PASS: issue created with number $NUMBER"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
