name: Test issue creation with update_existing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          filename: actions/hardened/JasonEtco--create-an-issue/v2.9.0/tests/fixtures/ISSUE_TEMPLATE.md
          update_existing: true
          search_existing: open
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Assert issue number output is set
        env:
          ISSUE_NUMBER: ${{ steps.action.outputs.number }}
          ISSUE_URL: ${{ steps.action.outputs.url }}
        run: |
          echo "issue number: $ISSUE_NUMBER"
          echo "issue url: $ISSUE_URL"
          if [ -z "$ISSUE_NUMBER" ]; then
            echo "FAIL: expected issue number to be set"
            exit 1
          fi
          if [ -z "$ISSUE_URL" ]; then
            echo "FAIL: expected issue url to be set"
            exit 1
          fi
          echo "PASS"
