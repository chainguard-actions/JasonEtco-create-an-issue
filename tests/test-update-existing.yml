name: Test update existing issue
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create issue template for update test
        run: |
          mkdir -p .github
          cat > .github/ISSUE_TEMPLATE.md << 'EOF'
          ---
          title: Recurring Automated Issue
          labels: automated
          ---
          This issue is updated if it already exists.

          ## Status
          Checked and updated by automated workflow.
          EOF

      - id: action
        uses: .
        with:
          update_existing: "true"
          search_existing: open
        continue-on-error: true

      - name: Assert action ran with update_existing or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          NUMBER: ${{ steps.action.outputs.number }}
          URL: ${{ steps.action.outputs.url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "number: $NUMBER"
          echo "url: $URL"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$NUMBER" ]; then
              echo "FAIL: action succeeded but 'number' output is empty"
              exit 1
            fi
            if [ -z "$URL" ]; then
              echo "FAIL: action succeeded but 'url' output is empty"
              exit 1
            fi
            echo "PASS: issue created/updated with number=$NUMBER url=$URL"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
