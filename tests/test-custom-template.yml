name: Test custom template filename
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up custom template
        run: |
          mkdir -p .github/custom
          cp tests/fixtures/CUSTOM_TEMPLATE.md .github/custom/CUSTOM_TEMPLATE.md

      - id: action
        uses: .
        continue-on-error: true
        with:
          filename: .github/custom/CUSTOM_TEMPLATE.md

      - name: Assert action ran with custom template (outputs set, or failed gracefully on the sentinel repo)
        env:
          NUMBER: ${{ steps.action.outputs.number }}
          URL: ${{ steps.action.outputs.url }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "number: $NUMBER"
          echo "url: $URL"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$NUMBER" ]; then
              echo "FAIL: action succeeded but 'number' output is empty"
              exit 1
            fi
            if [ -z "$URL" ]; then
              echo "FAIL: action succeeded but 'url' output is empty"
              exit 1
            fi
            echo "PASS: issue created with number=$NUMBER url=$URL"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
