name: Test custom template file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create custom issue template
        run: |
          mkdir -p .github/templates
          cat > .github/templates/custom-issue.md << 'EOF'
          ---
          title: Custom Template Issue
          labels: enhancement
          ---
          This issue was created from a custom template.

          ## Details
          - Created by: automated test
          - Template: custom-issue.md
          EOF

      - id: action
        uses: .
        with:
          filename: .github/templates/custom-issue.md
        continue-on-error: true

      - name: Assert action ran with custom template or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          NUMBER: ${{ steps.action.outputs.number }}
          URL: ${{ steps.action.outputs.url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "number: $NUMBER"
          echo "url: $URL"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$NUMBER" ]; then
              echo "FAIL: action succeeded but 'number' output is empty"
              exit 1
            fi
            if [ -z "$URL" ]; then
              echo "FAIL: action succeeded but 'url' output is empty"
              exit 1
            fi
            echo "PASS: issue created with number=$NUMBER url=$URL"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
