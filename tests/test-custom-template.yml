name: Test custom template filename
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up custom issue template
        run: |
          mkdir -p .github/custom-templates
          cat > .github/custom-templates/my-issue.md << 'EOF'
          ---
          title: Custom Template Issue
          labels: enhancement
          ---

          This issue was created from a custom template path.
          EOF

      - id: create-issue
        uses: .
        continue-on-error: true
        with:
          filename: .github/custom-templates/my-issue.md

      - name: Assert action ran (outputs set, or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.create-issue.outcome }}
          NUMBER: ${{ steps.create-issue.outputs.number }}
          URL: ${{ steps.create-issue.outputs.url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "number: $NUMBER"
          echo "url: $URL"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$NUMBER" ]; then
              echo "FAIL: action succeeded but 'number' output is empty"
              exit 1
            fi
            if [ -z "$URL" ]; then
              echo "FAIL: action succeeded but 'url' output is empty"
              exit 1
            fi
            echo "PASS: issue created from custom template, number=$NUMBER url=$URL"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
