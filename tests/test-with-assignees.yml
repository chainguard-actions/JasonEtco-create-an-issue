name: Test issue creation with assignees
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up issue template
        run: |
          mkdir -p .github
          cp "$GITHUB_WORKSPACE/tests/fixtures/ISSUE_TEMPLATE.md" .github/ISSUE_TEMPLATE.md

      - id: create-issue
        uses: .
        continue-on-error: true
        with:
          filename: .github/ISSUE_TEMPLATE.md
          assignees: octocat

      - name: Assert action ran (outputs set, or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.create-issue.outcome }}
          NUMBER: ${{ steps.create-issue.outputs.number }}
          URL: ${{ steps.create-issue.outputs.url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "number: $NUMBER"
          echo "url: $URL"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$NUMBER" ]; then
              echo "FAIL: action succeeded but 'number' output is empty"
              exit 1
            fi
            if [ -z "$URL" ]; then
              echo "FAIL: action succeeded but 'url' output is empty"
              exit 1
            fi
            echo "PASS: issue created with assignees, number=$NUMBER url=$URL"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
